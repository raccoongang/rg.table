<div id="action_bar_{{ table_name }}" class="is-flex is-align-items-center mb-2" style="gap: 0.5rem;">
  <input type="hidden" name="_action_submit" value="1">
  <input type="hidden" name="_action" value="{{ action_name }}">
  <input type="hidden" name="_confirmed" value="1">
  <span class="has-text-warning has-text-weight-bold">{{ confirm_message }}</span>
  <button type="button" class="button is-danger is-small"
          data-on:click="@post('{{ url }}', {contentType: 'form'})">
    Confirm
  </button>
  <button type="button" class="button is-small"
          data-on:click="@get('{{ url }}')">
    Cancel
  </button>
</div>
