{% load i18n %}
<div id="action_bar_{{ table_name }}" class="d-flex align-items-center gap-2 mb-2">
  <input type="hidden" name="_action_submit" value="1">
  <input type="hidden" name="_action" value="{{ action_name }}">
  <input type="hidden" name="_confirmed" value="1">
  <span class="text-warning fw-bold">{{ confirm_message }}</span>
  <button type="button" class="btn btn-danger btn-sm"
          data-on:click="@post('{{ url }}', {contentType: 'form'})">
    {% trans "Confirm" %}
  </button>
  <button type="button" class="btn btn-secondary btn-sm"
          data-on:click="@get('{{ url }}')">
    {% trans "Cancel" %}
  </button>
</div>
