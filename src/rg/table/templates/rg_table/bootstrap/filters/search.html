{% load i18n %}
<div class="input-group">
  <span class="input-group-text">
    {# Search icon - hidden when loading #}
    <svg data-show="!$fetching" xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
      <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
    </svg>
    {# Loading spinner - shown when fetching #}
    <span data-show="$fetching" class="spinner-border spinner-border-sm" role="status">
      <span class="visually-hidden">{% trans "Loading..." %}</span>
    </span>
  </span>
  <input type="text"
         class="form-control"
         placeholder="{% trans "Search..." %}"
         name="q"
         data-bind:table-query-string
         value="{{ table.filterset.form.q.value|default:'' }}"
         data-indicator:fetching
         data-on:input__debounce.500ms="@get('{{ request.path }}', {contentType: 'form'})">
</div>
