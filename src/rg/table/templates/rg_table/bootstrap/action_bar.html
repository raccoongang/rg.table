{% if table.actions %}
<div id="action_bar_{{ table.table_name }}" class="d-flex align-items-center gap-2 mb-2"
     data-signals="{table{{ table.table_name }}ActionBusy: false}">
  <label class="form-check-label d-flex align-items-center gap-1" style="cursor: pointer;">
    <input type="checkbox"
           class="form-check-input"
           data-attr:checked="$table{{ table.table_name }}SelectAll"
           data-on:click="$table{{ table.table_name }}SelectAll = !$table{{ table.table_name }}SelectAll">
    Select all
  </label>
  <input type="hidden" name="_action_submit" value="1">
  <select name="_action" class="form-select form-select-sm" style="width: auto;">
    {% for action in table.actions %}
    <option value="{{ action.name }}">{{ action.label }}</option>
    {% endfor %}
  </select>
  <button type="button" class="btn btn-outline-secondary btn-sm"
          data-attr:disabled="$table{{ table.table_name }}ActionBusy"
          data-on:click="$table{{ table.table_name }}ActionBusy = true; @post('{{ request.get_full_path }}', {contentType: 'form'})">
    <span data-show="!$table{{ table.table_name }}ActionBusy">Go</span>
    <span data-show="$table{{ table.table_name }}ActionBusy">
      <span class="spinner-border spinner-border-sm" role="status"></span>
    </span>
  </button>
  {% if table.empty_selection_message %}
  <div class="alert alert-warning py-1 px-2 mb-0 small">
    {{ table.empty_selection_message }}
  </div>
  {% endif %}
</div>
{% endif %}
