[project]
name = "rg-table4"
version = "0.1.0"
description = "Django table rendering helper extending django-tables2 with Bootstrap/Bulma templates and Datastar integration"
readme = "README.md"
authors = [
    { name = "Oleksii Koval", email = "alex@koval.kharkov.ua" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "tables", "bootstrap", "bulma", "datastar"]
dependencies = [
    "datastar-py>=0.8.0",
    "django>=5.0",
    "django-tables2>=2.7",
]

[project.optional-dependencies]
filters = [
    "django-filter>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "pre-commit>=3.7",
]
all = [
    "rg-table4[filters,dev]",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# These are ruff linting rule categories:                                                                                                         
select = ["E", "F", "I", "N", "W", "UP", "DJ"]
# ┌──────┬──────────────────────┬───────────────────────────────────────────────────────────────┐                                                 
# │ Code │         Name         │                          Description                          │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ E    │ pycodestyle errors   │ PEP 8 style errors (indentation, whitespace, line length)     │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ F    │ Pyflakes             │ Logic errors (undefined names, unused imports/variables)      │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ I    │ isort                │ Import sorting and organization                               │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ N    │ pep8-naming          │ Naming conventions (classes CamelCase, functions snake_case)  │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ W    │ pycodestyle warnings │ PEP 8 style warnings (less severe than E)                     │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ UP   │ pyupgrade            │ Modernize syntax for your target Python version (e.g., use `  │                                                 
# ├──────┼──────────────────────┼───────────────────────────────────────────────────────────────┤                                                 
# │ DJ   │ flake8-django        │ Django-specific rules (model ordering, __str__ methods, etc.) │                                                 
# └──────┴──────────────────────┴───────────────────────────────────────────────────────────────┘                                                 
# This is a reasonable selection for a Django project. You might also consider adding:                                                            
# - B - flake8-bugbear (common bugs and design problems)                                                                                          
# - C4 - flake8-comprehensions (better list/dict/set comprehensions)                                                                              
# - SIM - flake8-simplify (code simplification suggestions)                                                                                       
# - RUF - Ruff-specific rules                                                                                                                     

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[project.urls]
Homepage = "https://github.com/avkoval/rg.table4"
Documentation = "https://github.com/avkoval/rg.table4#readme"
Repository = "https://github.com/avkoval/rg.table4"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rg"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
