[project]
name = "rg-table"
version = "0.1.0"
description = "Django table rendering helper extending django-tables2 with Bootstrap/Bulma templates and Datastar integration"
readme = "README.md"
authors = [
    { name = "Oleksii Koval", email = "alex@koval.kharkov.ua" }
]
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]
keywords = ["django", "tables", "bootstrap", "bulma", "datastar"]
dependencies = [
    "datastar-py>=0.8.0",
    "django>=5.0",
    "django-tables2>=2.7",
]

[project.optional-dependencies]
filters = [
    "django-filter>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.10",
    "django-stubs>=5.0",
    "pre-commit>=3.7",
]
docs = [
    "mkdocs-material>=9.5",
    "pymdown-extensions>=10.0",
]
all = [
    "rg-table[filters,dev,docs]",
]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "DJ"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main"]
strict = true

[[tool.mypy.overrides]]
module = [
    "django_tables2",
    "django_tables2.*",
    "django_filters",
    "django_filters.*",
    "datastar",
    "datastar.*",
]
ignore_missing_imports = true

[project.urls]
Homepage = "https://github.com/raccoongang/rg.table"
Documentation = "https://raccoongang.github.io/rg.table"
Repository = "https://github.com/raccoongang/rg.table"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rg"]

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-v --tb=short"
